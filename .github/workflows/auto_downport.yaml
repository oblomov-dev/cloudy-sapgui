name: auto_downport

# Manual for now. The downport does not produce a clean 7.02 branch yet,
# see the "Downport" section of the README for what is still open. Once
# `npm run auto_downport` ends with zero findings, add
#   on:
#     push:
#       branches: [main]
# so that every change to main refreshes the 702 branch.
on:
  workflow_dispatch:

concurrency:
  group: auto_downport

permissions:
  contents: read

jobs:
  auto_downport:
    if: github.repository == 'oblomov-dev/cloudy-sapgui'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run auto_downport

      - name: Commit and push to the 702 branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --staged --quiet || git commit -m "Downport changes"
          git checkout -b 702
          git push --force origin HEAD:702
